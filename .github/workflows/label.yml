name: Apply a case label

# A decision is a label on the case issue: list:url, list:host, and list:address add the proposed entry to the own
# files with the evidence line; unlist adds it to own/allow.txt; not-a-phish and already close the case. The
# decision comes from tools/decide.py in the case workflow (dispatched here, because a label added with the
# workflow token raises no event) or from a person adding the label by hand.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Case issue number"
        required: true
      label:
        description: "list:url, list:host, list:address, unlist, not-a-phish, or already"
        required: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: own-files
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["list:url", "list:host", "list:address", "unlist", "not-a-phish", "already"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LABEL: ${{ inputs.label || github.event.label.name }}
      NUMBER: ${{ inputs.issue || github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply the label to the own files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/apply_label.py --label "$LABEL" --issue "$NUMBER"

      - name: Test the own files
        run: pip install -r requirements.txt && python -m pytest -q tests

      - name: Commit, push, and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if git diff --quiet -- own; then echo "nothing to commit"; exit 0; fi
          git config user.name "Verdetto"
          git config user.email "324638328+verdettoqr@users.noreply.github.com"
          git add own
          git commit -m "own: case #$NUMBER ($LABEL)"
          git push
          gh workflow run build.yml
          gh issue comment "$NUMBER" --body "Applied as \`$LABEL\`; the build is running and phones pick the bundle up at their next check."
