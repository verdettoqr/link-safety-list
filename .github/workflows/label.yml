name: Apply a case label

# The person's decision is a label on the case issue. list:url, list:host, and list:address add the proposed entry
# to the own files with the evidence line; unlist adds it to own/allow.txt; not-a-phish and already close the case.
# A push made with the workflow token starts no other workflow, so the build is dispatched by hand at the end.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: own-files
  cancel-in-progress: false

jobs:
  apply:
    if: contains(fromJSON('["list:url", "list:host", "list:address", "unlist", "not-a-phish", "already"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply the label to the own files
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ github.event.label.name }}
          NUMBER: ${{ github.event.issue.number }}
        run: python tools/apply_label.py --label "$LABEL" --issue "$NUMBER"

      - name: Test the own files
        run: pip install -r requirements.txt && python -m pytest -q tests

      - name: Commit, push, and build
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ github.event.label.name }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          if git diff --quiet -- own; then echo "nothing to commit"; exit 0; fi
          git config user.name "Verdetto"
          git config user.email "324638328+verdettoqr@users.noreply.github.com"
          git add own
          git commit -m "own: case #$NUMBER ($LABEL)"
          git push
          gh workflow run build.yml
          gh issue comment "$NUMBER" --body "Applied as \`$LABEL\`; the build is running and phones pick the bundle up at their next check."
