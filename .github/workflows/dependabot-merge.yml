name: Merge Dependabot action updates

# Keeps the commit-pinned actions in build.yml current without a person in the loop:
# Dependabot opens the pull request, this job runs the test suite on it, and if the
# update is a GitHub-owned action (actions/ or dependabot/) it merges, major versions
# included (operator, 2026-09-04: merges are automatic). A failed build after a merge
# opens a build-failure issue from build.yml, so a bad major surfaces the same day.
# Anything from another publisher stays open for a human. Workflows that
# Dependabot triggers get a read-only token unless permissions are declared, hence
# the explicit block; the list-signing secret is not exposed to this workflow.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Read the update
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # One decision, computed once: any release of a GitHub-owned action merges itself once the tests pass.
      - name: Decide
        id: decide
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          KIND: ${{ steps.meta.outputs.update-type }}
        run: |
          merge=false
          case "$NAMES" in actions/*|dependabot/*) owned=true ;; *) owned=false ;; esac
          if [ "$ECOSYSTEM" = "github_actions" ] && [ "$owned" = true ]; then merge=true; fi
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          echo "ecosystem=$ECOSYSTEM names=$NAMES kind=$KIND merge=$merge"

      - name: Merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR"

      - name: Leave it for a person
        if: steps.decide.outputs.merge != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR" --body 'Tests pass. Not merged automatically because the action is not published by GitHub, so it waits for a person.'
