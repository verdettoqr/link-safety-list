name: Build the list

on:
  schedule:
    - cron: "17 */6 * * *"   # four times a day; phishing sites live hours to days
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build_list.py", "verify.py", "tests/**", ".github/workflows/build.yml", "requirements.txt"]

permissions:
  contents: write

concurrency:
  group: build-the-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Build
        env:
          PHISHTANK_APP_KEY: ${{ secrets.PHISHTANK_APP_KEY }}
          PHISHTANK_UA: ${{ secrets.PHISHTANK_UA }}
          LIST_SIGNING_KEY: ${{ secrets.LIST_SIGNING_KEY }}
        run: python build_list.py --out dist

      - name: Verify what was built
        run: python verify.py dist https://example.com/ www.bbc.co.uk

      # One rolling release tagged "current": the assets are replaced on every build, so the repository
      # never grows and the download addresses never change.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if ! gh release view current >/dev/null 2>&1; then
            gh release create current --title "Current bundle" --notes "Rolling release. The assets are replaced on every build; see list.json for the build time and source counts." --latest=false
          fi
          # every built file, so a new reference asset can never be listed in the manifest and left unuploaded
          gh release upload current dist/* --clobber
          python -c "import json;m=json.load(open('dist/list.json'));a=m['assets']['list.bin'];print('published',a['url_count'],'urls',a['host_count'],'hosts',a['address_count'],'addresses',m['generated_at'])"

  # A failed build opens one issue (or adds to the open one) so it is never silent; the next
  # success closes it. Phones keep the last published bundle in between, so a failure is a
  # staleness problem, not an outage, but it must be seen the same day.
  alert:
    needs: build
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label build-failure --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Failed again ($GITHUB_EVENT_NAME). Run: $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "List build failed" --label build-failure --body "The list build failed ($GITHUB_EVENT_NAME). Phones keep the last published bundle until a build succeeds; this issue closes itself on the next success. Run: $RUN_URL"
          fi

  recover:
    needs: build
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label build-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "A build succeeded again. Run: $RUN_URL"
          done
